id: phpinfo-exposure
info:
  name: phpinfo() Exposure
  author: darco
  severity: medium
  description: Detects exposed phpinfo() pages revealing PHP configuration, environment variables, and server details.
  tags: php,exposure,config,info
  remediation: Remove or restrict access to phpinfo() files. Never expose them in production.

requests:
  - method: GET
    path:
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/info.php"
      - "{{BaseURL}}/phpinfo"
      - "{{BaseURL}}/php/info"
      - "{{BaseURL}}/test.php"
      - "{{BaseURL}}/pi.php"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "phpinfo()"
          - "PHP Version"
          - "System"
          - "Build Date"
          - "Server API"
          - "PHP License"
        part: body
        condition: or
