id: xss-reflected-basic
info:
  name: Reflected XSS Detection
  author: darco
  severity: high
  description: Detects reflected cross-site scripting (XSS) through payload reflection in response body.
  tags: xss,injection,web,reflected
  remediation: Encode user input before rendering in HTML. Implement Content-Security-Policy headers.

requests:
  - method: GET
    path:
      - "{{BaseURL}}/{{param}}<script>alert(1)</script>"
      - "{{BaseURL}}/{{param}}<img src=x onerror=alert(1)>"
      - "{{BaseURL}}/{{param}}<svg onload=alert(1)>"
      - "{{BaseURL}}/{{param}}\"><script>alert(1)</script>"
      - "{{BaseURL}}/{{param}}'><script>alert(1)</script>"
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<script>alert(1)</script>"
          - "<img src=x onerror=alert(1)>"
          - "<svg onload=alert(1)>"
        part: body
        condition: or
      - type: regex
        regex:
          - "<script[^>]*>alert\\(1\\)</script>"
          - "<img[^>]*onerror\\s*=\\s*alert\\(1\\)"
          - "<svg[^>]*onload\\s*=\\s*alert\\(1\\)"
        part: body
        condition: or
