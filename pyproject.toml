[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darco"
version = "0.1.0"
description = "Agent HTTP toolkit for pentesting: ingest, session, mutate, diff, analyze, proxy, discover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "flake8>=7.0",
]

[project.scripts]
darco = "darco.cli:main"

[tool.setuptools.packages.find]
include = ["darco*"]
